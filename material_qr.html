<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資材QR一覧</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px;font-weight:800;font-size:22px;display:flex;justify-content:space-between;align-items:center}
header small{font-size:12px;color:#d1d5db}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}
select,input,button{width:100%;font:inherit;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
button{border:0;font-weight:800;cursor:pointer}
.primary{background:#0f766e;color:#fff;margin-top:12px}
.dark{background:#111827;color:#fff;margin-top:8px}
.muted{color:#6b7280;font-size:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{background:#fff;border:1px solid #cfd5dc;border-radius:12px;padding:10px;display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;break-inside:avoid}
.qr{width:92px;height:92px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{max-width:92px!important;max-height:92px!important}
.name{font-weight:900;font-size:15px;line-height:1.25}
.meta{font-size:12px;color:#4b5563;margin-top:5px;line-height:1.35}
.count{font-weight:800;color:#0f766e}
.hidden{display:none!important}
@media(max-width:600px){.qrgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media print{
  header,.controls,.muted{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;padding:0;margin:0}
  .qrgrid{grid-template-columns:repeat(3,1fr);gap:5mm}
  .label{border:1px solid #777;border-radius:0;padding:4mm;grid-template-columns:27mm 1fr;min-height:35mm}
  .qr{width:27mm;height:27mm}
  .qr img,.qr canvas{width:27mm!important;height:27mm!important;max-width:none!important;max-height:none!important}
  .name{font-size:11pt}
  .meta{font-size:8.5pt}
  @page{size:A4;margin:8mm}
}

.app-title{display:flex;align-items:center;gap:10px}
.brand-logo{
  display:flex;align-items:center;justify-content:center;
  background:#fff;border-radius:10px;padding:4px 7px;
  box-shadow:0 1px 3px #0003;
}
.brand-logo img{display:block;width:72px;height:auto;max-height:44px;object-fit:contain}
@media(max-width:420px){
  .brand-logo img{width:64px;max-height:40px}
}


.print-help{
  display:none;
  position:sticky;top:0;z-index:100;
  background:#fff7ed;color:#9a3412;
  border-bottom:1px solid #fed7aa;
  padding:10px 12px;font-size:13px;font-weight:800;
}
.print-help .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.print-help button{padding:10px;border-radius:10px;border:0;font-weight:900}
.print-help .tryprint{background:#111827;color:#fff}
.print-help .backbtn{background:#e5e7eb;color:#111827}
body.print-preview .print-help{display:block}
body.print-preview header,
body.print-preview .controls{display:none!important}
body.print-preview .wrap{padding-top:10px}
body.print-preview .card{box-shadow:none}
body.print-preview #loadMoreBtn{display:none!important}


.label-actions{margin-top:8px}
.print-one{
  width:auto!important;
  padding:7px 10px!important;
  border:0!important;
  border-radius:8px!important;
  background:#111827!important;
  color:#fff!important;
  font-size:12px!important;
  font-weight:800!important;
}
@media print{
  .label-actions{display:none!important}
  body.single-print .label{display:none!important}
  body.single-print .label.print-target{
    display:grid!important;
    width:90mm!important;
    min-height:40mm!important;
    margin:0 auto!important;
    border:1px solid #777!important;
    grid-template-columns:30mm 1fr!important;
    gap:4mm!important;
    padding:4mm!important;
  }
  body.single-print .label.print-target .qr{
    width:30mm!important;height:30mm!important;
  }
  body.single-print .label.print-target .qr img,
  body.single-print .label.print-target .qr canvas{
    width:30mm!important;height:30mm!important;
    max-width:none!important;max-height:none!important;
  }
  body.single-print .label.print-target .name{font-size:14pt!important}
  body.single-print .label.print-target .meta{font-size:10pt!important}
}


.selection-bar{
  position:sticky;bottom:10px;z-index:40;
  display:none;
  grid-template-columns:1fr auto;
  gap:10px;align-items:center;
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:#111827;color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.selection-bar.show{display:grid}
.selection-count{font-weight:900}
.selection-actions{display:flex;gap:8px}
.selection-actions button{
  width:auto;padding:10px 14px;border-radius:10px;border:0;font-weight:900
}
.print-selected{background:#0f766e;color:#fff}
.clear-selected{background:#e5e7eb;color:#111827}
.label{position:relative;cursor:pointer;transition:.15s}
.label.selected{
  border:3px solid #0f766e;
  box-shadow:0 0 0 3px rgba(15,118,110,.13);
}
.label.selected::after{
  content:"✓";
  position:absolute;top:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#0f766e;color:#fff;
  font-size:18px;font-weight:900;
}
.select-hint{
  font-size:13px;color:#6b7280;margin:6px 0 10px;
}
@media print{
  body.selection-print .label{display:none!important}
  body.selection-print .label.selected{
    display:grid!important;
    border:1px solid #777!important;
    box-shadow:none!important;
  }
  body.selection-print .label.selected::after{display:none!important}
  body.selection-print .selection-bar,
  body.selection-print .select-hint{display:none!important}
}

</style>
</head>
<body>
<div id="printHelp" class="print-help">
  印刷プレビューです。iPhoneでは下の「印刷を開く」を押すか、反応しない場合はブラウザの共有ボタンから「プリント」を選んでください。
  <div class="actions">
    <button class="tryprint" id="tryPrintBtn">印刷を開く</button>
    <button class="backbtn" id="backPrintBtn">戻る</button>
  </div>
</div>

<div class="wrap">
  <div class="card controls">
    <h2>QRラベルを作る</h2>

    <label>ジャンル</label>
    <select id="category"><option value="">すべて</option></select>

    <div class="grid">
      <div>
        <label>材質</label>
        <select id="material"><option value="">すべて</option></select>
      </div>
      <div>
        <label>検索</label>
        <input id="search" placeholder="例：15A、エルボ、M16">
      </div>
    </div>

    <button class="primary" id="showBtn">QRを表示</button>
    <button class="dark" id="printBtn">印刷・PDF保存</button>
    <div class="muted">QRを読むと、その資材の「使用／納入」画面を直接開きます。</div>
  </div>

  <div class="card">
    <h2>資材QR <span class="count" id="count"></span></h2>
    <div id="status" class="muted">読み込み中...</div>
<div class="select-hint">印刷したいQRをタップして選択できます。</div>
    <div id="qrgrid" class="qrgrid"></div>
    <button class="dark hidden" id="loadMoreBtn" style="margin-top:12px">次の50件を表示</button>
    <div id="selectionBar" class="selection-bar">
      <div class="selection-count"><span id="selectedCount">0</span>件選択中</div>
      <div class="selection-actions">
        <button type="button" id="clearSelected" class="clear-selected">解除</button>
        <button type="button" id="printSelected" class="print-selected">選択分を印刷</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://bxbxroufwppcmswhoskp.supabase.co";
const SUPABASE_KEY="sb_publishable_slgq-RHBmjyF2TEys4j0fg_0t5YLSAA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BASE="https://ttrryy1105-ctrl.github.io/toolmanagement/material_management.html";

let items=[];
let currentList=[];
let shown=0;
const PAGE_SIZE=12;
const $=id=>document.getElementById(id);
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja",{numeric:true}));

async function init(){
  let rows=[];
  const pageSize=1000;
  let from=0;

  while(true){
    const {data,error}=await sb
      .from("material_items")
      .select("*")
      .eq("active",true)
      .order("category")
      .range(from,from+pageSize-1);

    if(error){
      $("status").textContent="読み込みエラー："+error.message;
      return;
    }

    const batch=data||[];
    rows=rows.concat(batch);

    if(batch.length<pageSize) break;
    from+=pageSize;
  }

  items=rows;
  fillFilters();
  clearResults();
}

function fillFilters(){
  $("category").innerHTML='<option value="">すべて</option>'+uniq(items.map(x=>x.category)).map(v=>`<option>${esc(v)}</option>`).join("");
  $("material").innerHTML='<option value="">すべて</option>'+uniq(items.map(x=>x.material)).map(v=>`<option>${esc(v)}</option>`).join("");
}

function filtered(){
  const c=$("category").value;
  const m=$("material").value;
  const q=$("search").value.trim().toLowerCase();
  return items.filter(x=>{
    if(c && x.category!==c) return false;
    if(m && x.material!==m) return false;
    if(q){
      const hay=Object.values(x)
        .filter(v=>v!==null && v!==undefined && (typeof v==="string" || typeof v==="number"))
        .map(v=>String(v))
        .join(" ")
        .toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

function detailParts(x){
  const raw=[];
  if(x.material) raw.push(String(x.material));
  if(x.size) raw.push(String(x.size));
  if(x.secondary_size){
    raw.push(`${x.secondary_size}${x.secondary_size_unit||""}`);
  }
  if(x.specification) raw.push(String(x.specification));

  // DB側で名称が違う場合にも主要な規格を拾う
  const candidates=[
    x.spec, x.standard, x.nominal_size, x.pipe_size,
    x.pressure_class, x.class, x.rating
  ];
  candidates.forEach(v=>{
    if(v!==null && v!==undefined && String(v).trim()) raw.push(String(v));
  });

  return [...new Set(raw.filter(Boolean))];
}

function makeLabel(x){
  const box=document.createElement("div");
  box.className="label";

  const qr=document.createElement("div");
  qr.className="qr";

  const info=document.createElement("div");
  const details=detailParts(x);

  info.innerHTML=
    `<div class="name">${esc(x.item_name)}</div>`+
    `<div class="meta">${esc(x.category)}<br>${esc(details.join(" / ") || "-")}</div>`;

  box.appendChild(qr);
  box.appendChild(info);

  box.addEventListener("click",()=>{
    box.classList.toggle("selected");
    updateSelectionBar();
  });

  new QRCode(qr,{
    text:`${BASE}?item=${encodeURIComponent(x.id)}`,
    width:92,
    height:92,
    correctLevel:QRCode.CorrectLevel.M
  });

  return box;
}

function render(reset=true){
  if(reset){
    const c=$("category").value;
    const m=$("material").value;
    const q=$("search").value.trim();

    // 条件なしの全件QR生成を禁止
    if(!c && !m && !q){
      currentList=[];
      shown=0;
      $("qrgrid").innerHTML="";
      $("count").textContent="";
      $("status").textContent="ジャンル・材質・検索のどれかを指定してください";
      $("loadMoreBtn").classList.add("hidden");
      return;
    }

    currentList=filtered();
    shown=0;
    $("qrgrid").innerHTML="";
  }

  $("count").textContent=`（${currentList.length}件）`;

  if(!currentList.length){
    $("status").textContent="該当する資材がありません";
    $("loadMoreBtn").classList.add("hidden");
    return;
  }

  const frag=document.createDocumentFragment();
  const next=currentList.slice(shown,shown+PAGE_SIZE);
  next.forEach(x=>frag.appendChild(makeLabel(x)));
  $("qrgrid").appendChild(frag);
  shown+=next.length;

  if(shown < currentList.length){
    $("loadMoreBtn").classList.remove("hidden");
    $("loadMoreBtn").textContent=`次の${Math.min(PAGE_SIZE,currentList.length-shown)}件を表示`;
    $("status").textContent=`${shown} / ${currentList.length}件を表示中`;
  }else{
    $("loadMoreBtn").classList.add("hidden");
    $("status").textContent=`${shown}件すべて表示`;
  }
}

function clearResults(){
  currentList=[];
  shown=0;
  $("qrgrid").innerHTML="";
  updateSelectionBar();
  $("count").textContent="";
  $("status").textContent="条件を選んで「QRを表示」を押してください（初期状態ではQRを読み込みません）";
  $("loadMoreBtn").classList.add("hidden");
}

function updateSelectionBar(){
  const n=document.querySelectorAll(".label.selected").length;
  $("selectedCount").textContent=n;
  $("selectionBar").classList.toggle("show", n>0);
}

$("clearSelected").onclick=()=>{
  document.querySelectorAll(".label.selected").forEach(el=>el.classList.remove("selected"));
  updateSelectionBar();
};

$("printSelected").onclick=()=>{
  const selected=[...document.querySelectorAll(".label.selected")];
  if(!selected.length){
    alert("印刷するQRを選んでください");
    return;
  }
  document.body.classList.add("selection-print");
  try{
    window.print();
  }finally{
    setTimeout(()=>document.body.classList.remove("selection-print"),800);
  }
};

$("showBtn").onclick=()=>render(true);
$("printBtn").onclick=()=>{ alert("下のQRをタップして選択し、「選択分を印刷」を押してください"); };
    return;
  }
  document.body.classList.remove("single-print");
  document.querySelectorAll(".label.print-target").forEach(el=>el.classList.remove("print-target"));
  try{
    window.print();
  }catch(e){
    document.body.classList.add("print-preview");
  }
};
$("tryPrintBtn").onclick=()=>{
  try{ window.print(); }
  catch(e){ alert("共有ボタンから「プリント」を選んでください。"); }
};
$("backPrintBtn").onclick=()=>{
  document.body.classList.remove("print-preview");
};
$("loadMoreBtn").onclick=()=>render(false);
$("category").onchange=clearResults;
$("material").onchange=clearResults;
$("search").oninput=clearResults;

init();
</script>
</body>
</html>
