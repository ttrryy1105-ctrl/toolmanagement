<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道工具登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0;color:#111}header{background:#111827;color:#fff;padding:18px;font-size:22px;font-weight:bold}.w{padding:14px;max-width:650px;margin:auto}.c{background:#fff;padding:16px;border-radius:15px;margin-bottom:12px}input,button{width:100%;padding:14px;font-size:17px;border-radius:10px;box-sizing:border-box;margin-top:8px}input{border:1px solid #bbb}button{border:0;font-weight:bold}.b{background:#111827;color:#fff}.x{background:#e5e7eb;color:#111}.red{background:#fee2e2;color:#991b1b}.item{padding:14px 0;border-bottom:1px solid #ddd}.small{color:#6b7280;font-size:14px;margin-top:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hide{display:none}</style></head><body><header>道工具 登録・編集</header><div class="w"><div class="c"><h2 id="ttl">新しい道工具を登録</h2><input id="no" placeholder="管理番号 例：T-005"><input id="nm" placeholder="道工具名 例：ディスクグラインダー"><button class="b" id="save" onclick="saveTool()">登録する</button><button class="x hide" id="cancel" onclick="resetForm()">編集をやめる</button></div><div class="c"><h2>登録済み道工具</h2><div id="list">読み込み中...</div><button class="x" onclick="loadTools()">更新</button></div></div><script>const db=supabase.createClient('https://bxbxroufwppcmswhoskp.supabase.co','sb_publishable_slgq-RHBmjyF2TEys4j0fg_0t5YLSAA');let editing='';const no=document.getElementById('no'),nm=document.getElementById('nm'),list=document.getElementById('list'),ttl=document.getElementById('ttl'),save=document.getElementById('save'),cancel=document.getElementById('cancel');function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}function resetForm(){editing='';no.value='';nm.value='';ttl.textContent='新しい道工具を登録';save.textContent='登録する';cancel.classList.add('hide')}async function loadTools(){let r=await db.from('tools').select('management_no,name').order('management_no');if(r.error){list.textContent='読み込みに失敗しました：'+r.error.message;return}if(!r.data.length){list.textContent='登録なし';return}list.innerHTML=r.data.map(t=>'<div class="item"><b>'+esc(t.name)+'</b><div class="small">'+esc(t.management_no)+'</div><div class="row"><button class="x" onclick="editTool(\''+String(t.management_no).replace(/'/g,"\\'")+'\',\''+String(t.name).replace(/'/g,"\\'")+'\')">✏️ 編集</button><button class="red" onclick="deleteTool(\''+String(t.management_no).replace(/'/g,"\\'")+'\',\''+String(t.name).replace(/'/g,"\\'")+'\')">🗑️ 削除</button></div></div>').join('')}function editTool(a,b){editing=a;no.value=a;nm.value=b;ttl.textContent='道工具を編集';save.textContent='変更を保存';cancel.classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})}async function saveTool(){let a=no.value.trim(),b=nm.value.trim();if(!a||!b){alert('管理番号と道工具名を入力してください');return}if(editing){if(a!==editing){let c=await db.from('tools').select('management_no').eq('management_no',a);if(c.error){alert('確認に失敗しました：'+c.error.message);return}if(c.data.length){alert('その管理番号はすでに使われています');return}}let r=await db.from('tools').update({management_no:a,name:b}).eq('management_no',editing);if(r.error){alert('変更に失敗しました：'+r.error.message);return}alert('変更しました');resetForm();loadTools();return}let c=await db.from('tools').select('management_no').eq('management_no',a);if(c.error){alert('確認に失敗しました：'+c.error.message);return}if(c.data.length){alert('その管理番号はすでに登録されています');return}let r=await db.from('tools').insert({management_no:a,name:b});if(r.error){alert('登録に失敗しました：'+r.error.message);return}alert('登録しました');resetForm();loadTools()}async function deleteTool(a,b){if(!confirm(b+'（'+a+'）を本当に削除しますか？'))return;let r=await db.from('tools').delete().eq('management_no',a);if(r.error){alert('削除できませんでした：'+r.error.message);return}alert('削除しました');resetForm();loadTools()}loadTools();</script></body></html>
