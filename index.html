<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道工具管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}header{background:#111827;color:#fff;padding:18px;font-size:22px;font-weight:bold}.w{padding:14px;max-width:650px;margin:auto}.c{background:#fff;padding:16px;border-radius:15px;margin-bottom:12px}button,input,select{width:100%;padding:14px;font-size:17px;border-radius:10px;box-sizing:border-box;margin-top:8px}button{border:0;font-weight:bold}.b{background:#111827;color:white}.r{background:#ef4444;color:white}.g{background:#22c55e;color:white}.x{background:#e5e7eb}.hide{display:none}.item{padding:12px 0;border-bottom:1px solid #ddd}</style></head><body><header>道工具管理</header><div class="w"><div class="c">使用者：<b id="u"></b><button class="x" onclick="nameSet()">名前変更</button></div><div class="c"><button class="x" onclick="show('main')">持出・返却</button><button class="x" onclick="show('list')">持出中一覧</button></div><section id="main"><div class="c"><select id="sel"></select><button class="b" onclick="openTool()">道工具を開く</button></div><div id="detail" class="c hide"><h2 id="nm"></h2><div id="no"></div><h3 id="st"></h3><div id="info"></div><input id="site" placeholder="現場名"><button id="act" class="r" onclick="action()">持ち出す</button></div></section><section id="list" class="hide"><div class="c"><h2>持出中一覧</h2><div id="out"></div><button class="x" onclick="loadList()">更新</button></div></section></div><script>const db=supabase.createClient('https://bxbxroufwppcmswhoskp.supabase.co','sb_publishable_slgq-RHBmjyF2TEys4j0fg_0t5YLSAA');let cur;function user(){return localStorage.toolUser||''}function nameSet(){let n=prompt('名前を入力してください',user());if(n){localStorage.toolUser=n.trim();u.textContent=n.trim()}}function show(x){main.classList.toggle('hide',x!='main');list.classList.toggle('hide',x!='list');if(x=='list')loadList()}async function init(){if(!user())nameSet();u.textContent=user();let r=await db.from('tools').select('management_no,name').order('management_no');r.data.forEach(t=>sel.add(new Option(t.name+' ('+t.management_no+')',t.management_no)));let q=new URLSearchParams(location.search).get('tool');if(q){sel.value=q;openTool()}}async function openTool(){let r=await db.from('tools').select('*').eq('management_no',sel.value).single();cur=r.data;detail.classList.remove('hide');nm.textContent=cur.name;no.textContent=cur.management_no;if(cur.is_checked_out){st.textContent='🔴 持出中';info.textContent=(cur.checked_out_by||'')+' / '+(cur.site_name||'');site.value=cur.site_name||'';act.textContent='返却する';act.className='g'}else{st.textContent='🟢 返却済';info.textContent='';site.value='';act.textContent='持ち出す';act.className='r'}}async function action(){let now=new Date().toISOString();if(cur.is_checked_out){await db.from('tools').update({is_checked_out:false,checked_out_by:null,site_name:null,returned_at:now,updated_at:now}).eq('id',cur.id);await db.from('tool_history').insert({tool_id:cur.id,action:'return',person_name:user(),site_name:cur.site_name});alert('返却しました')}else{if(!site.value.trim())return alert('現場名を入力してください');await db.from('tools').update({is_checked_out:true,checked_out_by:user(),site_name:site.value.trim(),checked_out_at:now,updated_at:now}).eq('id',cur.id);await db.from('tool_history').insert({tool_id:cur.id,action:'checkout',person_name:user(),site_name:site.value.trim()});alert('持ち出しました')}openTool()}async function loadList(){let r=await db.from('tools').select('*').eq('is_checked_out',true);out.innerHTML=r.data.length?r.data.map(t=>'<div class="item"><b>'+t.name+'</b><br>'+t.management_no+'<br>👤 '+t.checked_out_by+'<br>📍 '+t.site_name+'</div>').join(''):'持出中なし'}init()</script></body></html>
