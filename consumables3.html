<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMBI 消耗品管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070b12;
  --panel:#0e1622;
  --panel2:#111c2b;
  --blue:#1476ff;
  --blue2:#0d5fd6;
  --yellow:#ffd93d;
  --text:#f7f9fc;
  --muted:#9ca8b8;
  --line:#21344d;
  --danger:#8f2630;
}
body{
  margin:0;background:
  radial-gradient(circle at 80% 0%,rgba(20,118,255,.16),transparent 35%),
  linear-gradient(180deg,#06101e 0%,var(--bg) 50%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  background:linear-gradient(180deg,rgba(7,17,31,.98),rgba(7,13,21,.96));
  border-bottom:1px solid #1f3550;
  padding:20px 16px 18px;
}
.brand{max-width:680px;margin:auto}
.brandTop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logoImg{width:168px;max-width:48vw;height:auto;display:block}
.title{font-size:27px;font-weight:950;margin-top:12px;letter-spacing:.02em}
.subtitle{color:#76adff;font-size:11px;letter-spacing:1.8px;margin-top:3px}
.userBar{
  margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#0d1724;border:1px solid #20364f;border-radius:12px;padding:11px 12px;
}
.userBar small{color:var(--muted)}
.userName{font-weight:900;color:#fff}
.userEdit{border:1px solid #315b8f;background:#10253f;color:#bcd8ff;border-radius:8px;padding:8px 10px;font-weight:800}
.wrap{max-width:680px;margin:auto;padding:17px 14px 42px}
.menuCard{
  width:100%;min-height:110px;border:1px solid #20354f;border-radius:19px;
  margin-bottom:14px;padding:18px 17px;text-align:left;color:#fff;
  background:linear-gradient(135deg,#111b29,#0b131e);
  box-shadow:inset 4px 0 0 var(--blue),0 9px 22px rgba(0,0,0,.18);
}
.menuCard.primary{
  background:linear-gradient(135deg,#123c74,#0b2342);
  border-color:#24578f;
  box-shadow:inset 4px 0 0 var(--yellow),0 10px 24px rgba(0,0,0,.22);
}
.menuRow{display:flex;align-items:center;gap:14px}
.menuIcon{
  flex:0 0 50px;height:50px;border-radius:13px;display:grid;place-items:center;
  background:#102c52;border:1px solid #285c98;font-size:25px;
}
.primary .menuIcon{background:#f6c935;color:#10151b;border:0}
.menuText{min-width:0;flex:1}
.menuTitle{font-size:21px;font-weight:950}
.menuDesc{font-size:12px;color:#aeb9c7;margin-top:6px;line-height:1.45}
.arrow{font-size:27px;color:#4c9cff}
.primary .arrow{color:var(--yellow)}
.notice{
  margin-top:5px;border:1px solid #263950;background:#0b1420;border-radius:14px;
  padding:13px;text-align:center;color:#9facba;font-size:12px;
}
.card{
  background:linear-gradient(180deg,#111a27,#0b121c);
  border:1px solid #263b55;border-radius:18px;padding:17px;margin-bottom:14px;
}
.hero{
  background:linear-gradient(135deg,#173e72,#0c2340);
  border-color:#2b5e9b;
  box-shadow:inset 4px 0 0 var(--yellow);
}
h2,h3{margin-top:0}
label{display:block;margin:16px 0 7px;color:#cbd6e3;font-size:14px;font-weight:800}
input,select{
  width:100%;height:53px;border:1px solid #34506f;border-radius:12px;
  background:#070d15;color:#fff;font-size:17px;padding:0 13px;
}
.action{
  width:100%;min-height:55px;margin-top:21px;border:0;border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;font-size:18px;font-weight:950;
  box-shadow:0 8px 18px rgba(20,118,255,.22);
}
.back{border:0;background:none;color:#6ba9ff;font-size:16px;font-weight:850;padding:4px 0 14px}
.hide{display:none}
.unit{color:var(--yellow);font-weight:900;margin-top:8px}
.row{padding:14px 0;border-bottom:1px solid #24364c}
.row:last-child{border-bottom:0}
.itemName{font-size:17px;font-weight:900}
.total{display:inline-block;color:#68a8ff;font-size:18px;font-weight:950;margin:5px 0}
.tag{display:inline-block;background:#132945;color:#86b9ff;border-radius:7px;padding:4px 8px;font-size:12px}
.deleteBtn{margin-top:11px;border:1px solid #bd4b57;background:#651f27;color:#fff;border-radius:9px;padding:9px 13px;font-weight:850}
.empty{color:#9ba8b7;padding:10px 0}
.projectTitle{color:var(--yellow);font-size:20px;font-weight:950;margin-bottom:8px}
.footer{text-align:center;color:#536273;font-size:11px;margin-top:16px}
</style>
</head>

    <div class="title">消耗品管理</div>
    <div class="subtitle">CONSUMABLES MANAGEMENT</div>
    <div class="userBar">
      <div><small>使用者</small><br><span class="userName" id="userName">---</span></div>
      <button class="userEdit" onclick="changeUser()">名前変更</button>
    </div>
  </div>
</header>

<div class="wrap">

<section id="menu">
  <button class="menuCard primary" onclick="openUse()">
    <div class="menuRow">
      <div class="menuIcon">▣</div>
      <div class="menuText">
        <div class="menuTitle">消耗品を使用</div>
        <div class="menuDesc">QRコードまたは一覧から使用登録</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </button>

  <button class="menuCard" onclick="openHistory()">
    <div class="menuRow">
      <div class="menuIcon">▤</div>
      <div class="menuText">
        <div class="menuTitle">使用履歴</div>
        <div class="menuDesc">誰が・いつ・何を・どの案件で使ったかを確認</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </button>

  <button class="menuCard" onclick="openProject()">
    <div class="menuRow">
      <div class="menuIcon">▥</div>
      <div class="menuText">
        <div class="menuTitle">案件別使用量</div>
        <div class="menuDesc">案件ごとの消耗品使用量を集計</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </button>

  <div class="notice">ⓘ 在庫の確認は目視にて行ってください</div>
  <div class="footer">AMBI INTERNAL SYSTEM</div>
</section>

<section id="use" class="hide">
  <button class="back" onclick="showMenu()">← メニューへ戻る</button>
  <div class="card hero">
    <h2>消耗品を使用</h2>
    QRコードから開いた場合は消耗品が自動選択されます
  </div>
  <div class="card">
    <label>消耗品名</label>
    <select id="consumable"></select>

    <label>使用量</label>
    <input id="quantity" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="使用量を入力">
    <div id="unitDisplay" class="unit"></div>

    <label>案件番号</label>
    <input id="projectNumber" list="projectList" placeholder="案件番号を入力">
    <datalist id="projectList"></datalist>

    <label>日付</label>
    <input id="usedDate" type="date">

    <button class="action" onclick="registerUse()">使用登録</button>
  </div>
</section>

<section id="history" class="hide">
  <button class="back" onclick="showMenu()">← メニューへ戻る</button>
  <div class="card">
    <h2>使用履歴</h2>
    <div id="historyList">読み込み中...</div>
  </div>
</section>

<section id="project" class="hide">
  <button class="back" onclick="showMenu()">← メニューへ戻る</button>
  <div class="card">
    <h2>案件別使用量</h2>
    <label>案件番号</label>
    <input id="projectSearch" list="projectList2" placeholder="案件番号を入力または選択">
    <datalist id="projectList2"></datalist>
    <button class="action" onclick="loadProjectUsage()">表示する</button>
  </div>
  <div class="card">
    <div id="projectResult" class="empty">案件番号を選択してください</div>
  </div>
</section>

</div>

<script>
const db = supabase.createClient(
  'https://bxbxroufwppcmswhoskp.supabase.co',
  'sb_publishable_slgq-RHBmjyF2TEys4j0fg_0t5YLSAA'
);

let consumables = [];

function getUser(){
  let name=localStorage.getItem('ambi_consumable_user');
  if(!name){
    name=prompt('使用者の名前を入力してください');
    if(name&&name.trim()){
      name=name.trim();
      localStorage.setItem('ambi_consumable_user',name);
    }
  }
  document.getElementById('userName').textContent=name||'未設定';
  return name;
}

function changeUser(){
  const current=localStorage.getItem('ambi_consumable_user')||'';
  const name=prompt('使用者名を入力してください',current);
  if(!name||!name.trim()) return;
  localStorage.setItem('ambi_consumable_user',name.trim());
  document.getElementById('userName').textContent=name.trim();
}

function hideAll(){
  ['menu','use','history','project'].forEach(id=>document.getElementById(id).classList.add('hide'));
}
function showMenu(){hideAll();document.getElementById('menu').classList.remove('hide')}
function openUse(){hideAll();document.getElementById('use').classList.remove('hide')}
async function openHistory(){hideAll();document.getElementById('history').classList.remove('hide');await loadHistory()}
async function openProject(){hideAll();document.getElementById('project').classList.remove('hide');await loadProjects()}

async function loadConsumables(){
  const {data,error}=await db.from('consumables').select('*').eq('active',true).order('category').order('name');
  if(error){alert('消耗品の読み込みに失敗しました\n'+error.message);return}
  consumables=data||[];
  const select=document.getElementById('consumable');
  select.innerHTML='<option value="">選択してください</option>';
  consumables.forEach(c=>{
    const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.appendChild(o);
  });
  select.onchange=showUnit;
  const params=new URLSearchParams(location.search);
  const itemId=params.get('item');
  if(itemId){select.value=itemId;showUnit();openUse()}
}

function showUnit(){
  const id=Number(document.getElementById('consumable').value);
  const item=consumables.find(x=>Number(x.id)===id);
  document.getElementById('unitDisplay').textContent=item?'単位：'+item.unit:'';
}

async function loadProjects(){
  const {data,error}=await db.from('consumable_projects').select('*').order('last_used_at',{ascending:false});
  if(error)return;
  [document.getElementById('projectList'),document.getElementById('projectList2')].forEach(list=>{
    list.innerHTML='';
    (data||[]).forEach(p=>{const o=document.createElement('option');o.value=p.project_number;list.appendChild(o)});
  });
}

async function registerUse(){
  const user=getUser();
  const consumableId=Number(document.getElementById('consumable').value);
  const quantity=Number(document.getElementById('quantity').value);
  const project=document.getElementById('projectNumber').value.trim();
  const date=document.getElementById('usedDate').value;

  if(!user){alert('使用者名を入力してください');return}
  if(!consumableId){alert('消耗品を選択してください');return}
  if(!quantity||quantity<=0){alert('使用量を入力してください');return}
  if(!project){alert('案件番号を入力してください');return}
  if(!date){alert('日付を入力してください');return}

  const {error}=await db.from('consumable_usage').insert({
    user_name:user,consumable_id:consumableId,quantity,project_number:project,used_date:date
  });
  if(error){alert('登録に失敗しました\n'+error.message);return}

  await db.from('consumable_projects').upsert({
    project_number:project,last_used_at:new Date().toISOString()
  },{onConflict:'project_number'});

  alert('登録しました！');
  document.getElementById('quantity').value='';
  await loadProjects();
}

async function loadHistory(){
  const box=document.getElementById('historyList');
  box.textContent='読み込み中...';

  const {data,error}=await db.from('consumable_usage').select(`
    id,user_name,quantity,project_number,used_date,created_at,
    consumables(name,unit)
  `).order('created_at',{ascending:false}).limit(200);

  if(error){box.textContent='履歴の読み込みに失敗しました';return}
  if(!data||!data.length){box.innerHTML='<div class="empty">まだ使用履歴はありません</div>';return}

  box.innerHTML='';
  data.forEach(r=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML=
      '<div class="itemName">'+escapeHtml(r.consumables?.name||'不明')+'</div>'+
      '<div class="total">'+escapeHtml(r.quantity)+' '+escapeHtml(r.consumables?.unit||'')+'</div><br>'+
      '<span class="tag">'+escapeHtml(r.project_number)+'</span> '+escapeHtml(r.used_date)+
      '<br><small>使用者：'+escapeHtml(r.user_name)+'</small><br>'+
      '<button class="deleteBtn" onclick="deleteUsage('+Number(r.id)+')">🗑 間違い登録を削除</button>';
    box.appendChild(row);
  });
}

async function deleteUsage(id){
  if(!confirm('この使用履歴を削除しますか？\n\n間違い登録の場合のみ削除してください。'))return;
  const {error}=await db.from('consumable_usage').delete().eq('id',id);
  if(error){alert('削除に失敗しました\n'+error.message);return}
  alert('削除しました');
  await loadHistory();
}

async function loadProjectUsage(){
  const project=document.getElementById('projectSearch').value.trim();
  const box=document.getElementById('projectResult');
  if(!project){alert('案件番号を入力してください');return}
  box.textContent='集計中...';

  const {data,error}=await db.from('consumable_usage').select(`
    quantity,consumables(name,unit)
  `).eq('project_number',project);

  if(error){box.textContent='読み込みに失敗しました';return}
  if(!data||!data.length){box.innerHTML='<div class="empty">この案件の使用履歴はありません</div>';return}

  const totals={};
  data.forEach(r=>{
    const name=r.consumables?.name||'不明';
    const unit=r.consumables?.unit||'';
    const key=name+'|'+unit;
    if(!totals[key])totals[key]={name,unit,quantity:0};
    totals[key].quantity+=Number(r.quantity);
  });

  box.innerHTML='<div class="projectTitle">案件：'+escapeHtml(project)+'</div>';
  Object.values(totals).forEach(t=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<div class="itemName">'+escapeHtml(t.name)+'</div>'+
                  '<div class="total">'+escapeHtml(t.quantity)+' '+escapeHtml(t.unit)+'</div>';
    box.appendChild(row);
  });
}

function escapeHtml(v){
  return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
}

async function init(){
  getUser();
  document.getElementById('usedDate').value=new Date().toISOString().slice(0,10);
  await loadConsumables();
  await loadProjects();
}
init();
</script>

</body>
</html>
