<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020714">
<title>AMBI 消耗品管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#020714;
  --bg2:#061126;
  --card:#071426;
  --card2:#0b1d38;
  --blue:#0878ff;
  --blue2:#0c54d8;
  --cyan:#53d9ff;
  --yellow:#ffd51f;
  --text:#fff;
  --muted:#c2ccdc;
  --line:#0d4f9f;
  --danger:#9b2732;
}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  background:
    radial-gradient(circle at 76% 10%,rgba(0,104,255,.16),transparent 30%),
    radial-gradient(circle at 25% 48%,rgba(0,48,130,.10),transparent 42%),
    linear-gradient(180deg,#020713 0%,#020817 45%,#01050d 100%);
  overflow-x:hidden;
  padding-bottom:90px;
}

body::before{
  content:"";
  position:absolute;
  top:88px;
  right:-24%;
  width:120%;
  height:340px;
  pointer-events:none;
  z-index:0;
  transform:rotate(-8deg);
  background:
    linear-gradient(164deg,
      transparent 0 43%,
      rgba(0,70,255,.04) 43.5%,
      rgba(0,98,255,.22) 45%,
      rgba(0,142,255,.82) 46.2%,
      rgba(70,235,255,.98) 46.8%,
      rgba(0,126,255,.65) 47.5%,
      rgba(0,72,255,.10) 49%,
      transparent 51% 100%),
    linear-gradient(169deg,
      transparent 0 54%,
      rgba(0,88,255,.08) 55%,
      rgba(0,119,255,.45) 56.3%,
      rgba(66,217,255,.92) 57%,
      rgba(0,113,255,.36) 57.8%,
      transparent 59.6% 100%),
    linear-gradient(161deg,
      transparent 0 64%,
      rgba(0,76,255,.06) 65%,
      rgba(0,107,255,.33) 66.2%,
      rgba(0,185,255,.75) 67%,
      transparent 69% 100%);
  filter:
    drop-shadow(0 0 7px rgba(0,120,255,.85))
    drop-shadow(0 0 20px rgba(0,100,255,.42));
  opacity:.96;
}

.app{
  position:relative;
  z-index:1;
  max-width:720px;
  margin:0 auto;
}

header{
  padding:28px 22px 18px;
  background:transparent;
}

.logo{
  width:190px;
  max-width:53vw;
  height:auto;
  display:block;
  background:transparent;
  border:0;
  outline:0;
  box-shadow:none;
  filter:drop-shadow(0 0 9px rgba(0,93,255,.15));
}

.title{
  margin-top:14px;
  font-size:34px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.03em;
  text-shadow:0 0 14px rgba(0,102,255,.12);
}

.subtitle{
  margin-top:10px;
  color:#1679ff;
  font-size:13px;
  letter-spacing:1.6px;
  font-weight:700;
}

.userCard{
  margin-top:24px;
  min-height:92px;
  padding:14px 14px 14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid rgba(17,93,190,.9);
  border-radius:20px;
  background:linear-gradient(135deg,rgba(5,16,31,.96),rgba(3,12,25,.94));
  box-shadow:
    inset 0 0 22px rgba(0,87,255,.03),
    0 0 18px rgba(0,92,255,.06);
}

.userLeft{
  min-width:0;
  display:flex;
  align-items:center;
  gap:14px;
}

.userIcon{
  width:54px;
  height:54px;
  flex:0 0 54px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#0c73ff;
  background:radial-gradient(circle,#0a3b77 0%,#06214a 72%);
  border:1px solid #0e63c8;
  box-shadow:0 0 15px rgba(0,111,255,.22);
  font-size:30px;
}

.userMeta{
  min-width:0;
}

.userLabel{
  color:#d5dbe5;
  font-size:14px;
  line-height:1.1;
}

.userName{
  color:#fff;
  margin-top:4px;
  font-size:22px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.nameBtn{
  min-height:45px;
  padding:0 14px;
  border-radius:11px;
  border:1px solid #0b73f5;
  color:#8fc3ff;
  background:#051529;
  font-size:14px;
  font-weight:850;
  box-shadow:0 0 10px rgba(0,109,255,.08);
}

.content{
  padding:0 22px 22px;
}

.menuCard{
  position:relative;
  width:100%;
  min-height:150px;
  margin:14px 0;
  padding:24px 54px 24px 26px;
  display:flex;
  align-items:center;
  gap:22px;
  text-align:left;
  color:#fff;
  background:
    linear-gradient(135deg,rgba(9,29,57,.98),rgba(3,14,29,.98));
  border:1px solid rgba(12,92,189,.92);
  border-radius:22px;
  overflow:hidden;
  box-shadow:
    inset 5px 0 0 #0b75ff,
    0 14px 30px rgba(0,0,0,.18),
    0 0 20px rgba(0,102,255,.04);
}

.menuCard.primary{
  background:
    radial-gradient(circle at 25% 38%,rgba(0,100,255,.16),transparent 40%),
    linear-gradient(135deg,rgba(14,51,101,.99),rgba(4,22,43,.99));
  border-color:#0e6ee4;
  box-shadow:
    inset 5px 0 0 var(--yellow),
    0 14px 30px rgba(0,0,0,.20),
    0 0 26px rgba(0,107,255,.08);
}

.iconBox{
  width:86px;
  height:86px;
  flex:0 0 86px;
  display:grid;
  place-items:center;
  border-radius:18px;
  color:#fff;
  background:linear-gradient(145deg,#0d3f7d,#08285a);
  border:1px solid #0b67cf;
  box-shadow:inset 0 0 18px rgba(0,111,255,.15);
  font-size:42px;
}

.primary .iconBox{
  color:#08121f;
  background:linear-gradient(145deg,#ffe14a,#f6bd00);
  border:0;
  box-shadow:0 0 20px rgba(255,209,31,.08);
}

.menuInfo{
  min-width:0;
  flex:1;
}

.menuTitle{
  font-size:26px;
  font-weight:950;
  line-height:1.12;
  letter-spacing:-.02em;
}

.menuDesc{
  margin-top:10px;
  color:#e0e6ef;
  font-size:14px;
  line-height:1.45;
}

.chev{
  position:absolute;
  right:22px;
  top:50%;
  transform:translateY(-50%);
  color:#0b75ff;
  font-size:46px;
  line-height:1;
  font-weight:500;
  text-shadow:0 0 10px rgba(0,111,255,.45);
}

.primary .chev{
  color:var(--yellow);
  text-shadow:0 0 10px rgba(255,209,31,.18);
}

.notice{
  margin:18px 0 0;
  min-height:64px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid rgba(13,78,151,.9);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(5,18,34,.94),rgba(3,13,26,.96));
  color:#fff;
  font-size:15px;
}

.noticeIcon{
  width:32px;
  height:32px;
  flex:0 0 32px;
  display:grid;
  place-items:center;
  border:2px solid #0c71ff;
  border-radius:50%;
  color:#0c71ff;
  font-weight:900;
}

.notice strong{color:var(--yellow)}

.section{
  display:none;
  padding:4px 0 10px;
}

.section.active{display:block}

.backBtn{
  border:0;
  background:none;
  color:#72b2ff;
  font-size:16px;
  font-weight:850;
  padding:4px 0 14px;
}

.panel{
  background:linear-gradient(180deg,rgba(8,23,43,.98),rgba(3,13,25,.99));
  border:1px solid rgba(15,79,151,.9);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 0 20px rgba(0,89,255,.04);
}

.panel h2{
  margin:0 0 8px;
  font-size:24px;
}

.panel p{
  margin:0;
  color:#b8c6d8;
  font-size:13px;
}

label{
  display:block;
  margin:17px 0 7px;
  color:#d4dce8;
  font-size:14px;
  font-weight:800;
}

input,select{
  width:100%;
  height:54px;
  border:1px solid #244e7d;
  border-radius:12px;
  background:#020914;
  color:#fff;
  padding:0 13px;
  font-size:17px;
}

input:focus,select:focus{
  outline:2px solid #0c75ff;
  outline-offset:1px;
}

.unit{
  color:var(--yellow);
  margin-top:8px;
  font-size:14px;
  font-weight:900;
}

.action{
  width:100%;
  min-height:56px;
  margin-top:22px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#0e7cff,#0755ca);
  color:#fff;
  font-size:18px;
  font-weight:950;
  box-shadow:0 8px 20px rgba(0,95,255,.24);
}

.row{
  padding:14px 0;
  border-bottom:1px solid rgba(37,64,95,.9);
}

.row:last-child{border-bottom:0}

.itemName{
  font-size:17px;
  font-weight:900;
}

.total{
  display:inline-block;
  margin:6px 0;
  color:#6fb1ff;
  font-size:18px;
  font-weight:950;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:7px;
  background:#0d2f59;
  color:#8cc0ff;
  font-size:12px;
}

.deleteBtn{
  margin-top:12px;
  padding:9px 13px;
  border:1px solid #ad4650;
  border-radius:9px;
  background:#5f1c24;
  color:#fff;
  font-weight:850;
}

.empty{
  color:#91a0b4;
  padding:10px 0;
}

.projectTitle{
  color:var(--yellow);
  font-size:20px;
  font-weight:950;
  margin-bottom:8px;
}

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  height:84px;
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:linear-gradient(180deg,rgba(3,14,29,.96),rgba(2,8,18,.99));
  border-top:1px solid #0b4c96;
  backdrop-filter:blur(10px);
}

.navBtn{
  min-width:0;
  border:0;
  background:none;
  color:#d9e3f1;
  font-size:11px;
  font-weight:750;
}

.navIcon{
  display:block;
  font-size:27px;
  line-height:1;
  margin-bottom:6px;
}

.navBtn.active{
  color:#0b75ff;
}

@media (max-width:480px){
  header{padding:24px 16px 16px}
  .content{padding:0 16px 18px}
  .logo{width:170px}
  .title{font-size:31px}
  .menuCard{min-height:132px;padding:19px 48px 19px 18px;gap:15px}
  .iconBox{width:70px;height:70px;flex-basis:70px;font-size:33px}
  .menuTitle{font-size:22px}
  .menuDesc{font-size:12px}
  .chev{right:16px;font-size:38px}
  body::before{top:70px;right:-38%;width:145%;height:300px}
}

<main class="content">

<section id="menu" class="section active">

      <div class="menuDesc">QRコードまたは一覧から使用登録</div>

  </button>

  <button class="menuCard" type="button" onclick="openHistory()">

    </div>
    <div class="chev">›</div>
  </button>

  <button class="menuCard" type="button" onclick="openProject()">
    <div class="iconBox">▥</div>
    <div class="menuInfo">
      <div class="menuTitle">案件別使用量</div>
      <div class="menuDesc">案件ごとの消耗品使用量を集計</div>
    </div>

  </button>

  <div class="notice">
    <div class="noticeIcon">i</div>

<section id="use" class="section">
  <button class="backBtn" type="button" onclick="showMenu()">← メニューへ戻る</button>

  <div class="panel">
    <h2>消耗品を使用</h2>
    <p>QRコードから開いた場合は消耗品が自動選択されます</p>
  </div>

  <div class="panel">
    <label>消耗品名</label>
    <select id="consumable"></select>

    <label>使用量</label>
    <input id="quantity" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="使用量を入力">
    <div id="unitDisplay" class="unit"></div>

    <label>案件番号</label>
    <input id="projectNumber" list="projectList" placeholder="案件番号を入力">
    <datalist id="projectList"></datalist>

    <label>日付</label>
    <input id="usedDate" type="date">

    <button class="action" type="button" onclick="registerUse()">使用登録</button>
  </div>
</section>


<section id="history" class="section">
  <button class="backBtn" type="button" onclick="showMenu()">← メニューへ戻る</button>
  <div class="panel">
    <h2>使用履歴</h2>
    <div id="historyList">読み込み中...</div>
  </div>
</section>


<section id="project" class="section">
  <button class="backBtn" type="button" onclick="showMenu()">← メニューへ戻る</button>

  <div class="panel">
    <h2>案件別使用量</h2>

    <label>案件番号</label>
    <input id="projectSearch" list="projectList2" placeholder="案件番号を入力または選択">
    <datalist id="projectList2"></datalist>

    <button class="action" type="button" onclick="loadProjectUsage()">表示する</button>
  </div>

  <div class="panel">
    <div id="projectResult" class="empty">案件番号を選択してください</div>
  </div>
</section>

<nav class="bottomNav">
  <button id="navHome" class="navBtn active" type="button" onclick="showMenu()">
    <span class="navIcon">⌂</span>ホーム
  </button>
  <button id="navHistory" class="navBtn" type="button" onclick="openHistory()">
    <span class="navIcon">↶</span>使用履歴
  </button>
  <button id="navProject" class="navBtn" type="button" onclick="openProject()">
    <span class="navIcon">▥</span>案件別使用量
  </button>
</nav>


<script>
const db = supabase.createClient(
  'https://bxbxroufwppcmswhoskp.supabase.co',
  'sb_publishable_slgq-RHBmjyF2TEys4j0fg_0t5YLSAA'
);

let consumables=[];

function setActiveNav(id){
  ['navHome','navHistory','navProject'].forEach(x=>document.getElementById(x).classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function getUser(){
  let name=localStorage.getItem('ambi_consumable_user');
  if(!name){
    name=prompt('使用者の名前を入力してください');
    if(name&&name.trim()){
      name=name.trim();
      localStorage.setItem('ambi_consumable_user',name);
    }
  }
  document.getElementById('userName').textContent=name||'未設定';
  return name;
}

function changeUser(){
  const current=localStorage.getItem('ambi_consumable_user')||'';
  const name=prompt('使用者名を入力してください',current);
  if(!name||!name.trim())return;
  localStorage.setItem('ambi_consumable_user',name.trim());
  document.getElementById('userName').textContent=name.trim();
}

function hideAll(){
  ['menu','use','history','project'].forEach(id=>document.getElementById(id).classList.remove('active'));
}

function showMenu(){
  hideAll();
  document.getElementById('menu').classList.add('active');
  setActiveNav('navHome');
  window.scrollTo({top:0,behavior:'smooth'});
}

function openUse(){
  hideAll();
  document.getElementById('use').classList.add('active');
  setActiveNav('navHome');
  window.scrollTo({top:0,behavior:'smooth'});
}

async function openHistory(){
  hideAll();
  document.getElementById('history').classList.add('active');
  setActiveNav('navHistory');
  window.scrollTo({top:0,behavior:'smooth'});
  await loadHistory();
}

async function openProject(){
  hideAll();
  document.getElementById('project').classList.add('active');
  setActiveNav('navProject');
  window.scrollTo({top:0,behavior:'smooth'});
  await loadProjects();
}

async function loadConsumables(){
  const {data,error}=await db
    .from('consumables')
    .select('*')
    .eq('active',true)
    .order('category')
    .order('name');

  if(error){
    alert('消耗品の読み込みに失敗しました\n'+error.message);
    return;
  }

  consumables=data||[];
  const select=document.getElementById('consumable');
  select.innerHTML='<option value="">選択してください</option>';

  consumables.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.id;
    o.textContent=c.name;
    select.appendChild(o);
  });

  select.onchange=showUnit;

  const params=new URLSearchParams(location.search);
  const itemId=params.get('item');

  if(itemId){
    select.value=itemId;
    showUnit();
    openUse();
  }
}

function showUnit(){
  const id=Number(document.getElementById('consumable').value);
  const item=consumables.find(x=>Number(x.id)===id);
  document.getElementById('unitDisplay').textContent=item?'単位：'+item.unit:'';
}

async function loadProjects(){
  const {data,error}=await db
    .from('consumable_projects')
    .select('*')
    .order('last_used_at',{ascending:false});

  if(error)return;

  [document.getElementById('projectList'),document.getElementById('projectList2')].forEach(list=>{
    list.innerHTML='';
    (data||[]).forEach(p=>{
      const o=document.createElement('option');
      o.value=p.project_number;
      list.appendChild(o);
    });
  });
}

async function registerUse(){
  const user=getUser();
  const consumableId=Number(document.getElementById('consumable').value);
  const quantity=Number(document.getElementById('quantity').value);
  const project=document.getElementById('projectNumber').value.trim();
  const date=document.getElementById('usedDate').value;

  if(!user){alert('使用者名を入力してください');return}
  if(!consumableId){alert('消耗品を選択してください');return}
  if(!quantity||quantity<=0){alert('使用量を入力してください');return}
  if(!project){alert('案件番号を入力してください');return}
  if(!date){alert('日付を入力してください');return}

  const {error}=await db
    .from('consumable_usage')
    .insert({
      user_name:user,
      consumable_id:consumableId,
      quantity:quantity,
      project_number:project,
      used_date:date
    });

  if(error){
    alert('登録に失敗しました\n'+error.message);
    return;
  }

  await db
    .from('consumable_projects')
    .upsert({
      project_number:project,
      last_used_at:new Date().toISOString()
    },{onConflict:'project_number'});

  alert('登録しました！');
  document.getElementById('quantity').value='';
  await loadProjects();
}

async function loadHistory(){
  const box=document.getElementById('historyList');
  box.textContent='読み込み中...';

  const {data,error}=await db
    .from('consumable_usage')
    .select(`
      id,
      user_name,
      quantity,
      project_number,
      used_date,
      created_at,
      consumables(name,unit)
    `)
    .order('created_at',{ascending:false})
    .limit(200);

  if(error){
    box.textContent='履歴の読み込みに失敗しました';
    return;
  }

  if(!data||!data.length){
    box.innerHTML='<div class="empty">まだ使用履歴はありません</div>';
    return;
  }

  box.innerHTML='';

  data.forEach(r=>{
    const row=document.createElement('div');
    row.className='row';

    row.innerHTML=
      '<div class="itemName">'+escapeHtml(r.consumables?.name||'不明')+'</div>'+
      '<div class="total">'+escapeHtml(r.quantity)+' '+escapeHtml(r.consumables?.unit||'')+'</div><br>'+
      '<span class="tag">'+escapeHtml(r.project_number)+'</span> '+escapeHtml(r.used_date)+
      '<br><small>使用者：'+escapeHtml(r.user_name)+'</small><br>'+
      '<button class="deleteBtn" type="button" onclick="deleteUsage('+Number(r.id)+')">🗑 間違い登録を削除</button>';

    box.appendChild(row);
  });
}

async function deleteUsage(id){
  if(!confirm('この使用履歴を削除しますか？\n\n間違い登録の場合のみ削除してください。'))return;

  const {error}=await db
    .from('consumable_usage')
    .delete()
    .eq('id',id);

  if(error){
    alert('削除に失敗しました\n'+error.message);
    return;
  }

  alert('削除しました');
  await loadHistory();
}

async function loadProjectUsage(){
  const project=document.getElementById('projectSearch').value.trim();
  const box=document.getElementById('projectResult');

  if(!project){
    alert('案件番号を入力してください');
    return;
  }

  box.textContent='集計中...';

  const {data,error}=await db
    .from('consumable_usage')
    .select(`
      quantity,
      consumables(name,unit)
    `)
    .eq('project_number',project);

  if(error){
    box.textContent='読み込みに失敗しました';
    return;
  }

  if(!data||!data.length){
    box.innerHTML='<div class="empty">この案件の使用履歴はありません</div>';
    return;
  }

  const totals={};

  data.forEach(r=>{
    const name=r.consumables?.name||'不明';
    const unit=r.consumables?.unit||'';
    const key=name+'|'+unit;

    if(!totals[key]){
      totals[key]={name,unit,quantity:0};
    }

    totals[key].quantity+=Number(r.quantity);
  });

  box.innerHTML='<div class="projectTitle">案件：'+escapeHtml(project)+'</div>';

  Object.values(totals).forEach(t=>{
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=
      '<div class="itemName">'+escapeHtml(t.name)+'</div>'+
      '<div class="total">'+escapeHtml(t.quantity)+' '+escapeHtml(t.unit)+'</div>';
    box.appendChild(row);
  });
}

function escapeHtml(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}

async function init(){
  getUser();

  const today=new Date();
  const yyyy=today.getFullYear();
  const mm=String(today.getMonth()+1).padStart(2,'0');
  const dd=String(today.getDate()).padStart(2,'0');
  document.getElementById('usedDate').value=`${yyyy}-${mm}-${dd}`;

  await loadConsumables();
  await loadProjects();
}

init();
</script>
